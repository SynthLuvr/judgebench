allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  msw: true
  # laya engine (system-one-adapter 0.5.0): onnxruntime-node links its
  # native binding at install; protobufjs (via onnxruntime-web) only runs
  # a version-sanity check.
  onnxruntime-node: true
  protobufjs: true
# system-one-adapter 0.5.0 runs its laya provider in-process through the
# TypeScript port `laya-ts`, which upstream has not published to npm; the
# adapter pulls it from the SynthLuvr/laya fork (pinned tag, committed
# dist/). pnpm's blockExoticSubdeps has no per-package allowlist, so the
# only way to install the adapter is to allow exotic subdeps globally.
# This replaces the previous python dependency (pip install laya +
# LAYA_PYTHON interpreter per judgment) with pure Node.
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - system-one-adapter@0.3.0 || 0.4.0 || 0.5.0
scriptShell: bash
